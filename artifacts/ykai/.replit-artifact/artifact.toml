kind = "web"
previewPath = "/"
title = "YKAI"
version = "1.0.0"
id = "artifacts/ykai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20414

[services.development]
run = "pnpm --filter @workspace/ykai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ykai", "run", "build" ]
publicDir = "artifacts/ykai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20414"
BASE_PATH = "/"
